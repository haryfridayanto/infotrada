name: Build TRADA APK
on:
  push:
    branches: [ trada-android, main, master ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: TradaApp
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp TradaApp/app/build/outputs/apk/debug/app-debug.apk TRADA_2027_v1.0.apk
      - name: Upload artifact (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: trada-2027-debug-apk
          path: TRADA_2027_v1.0.apk
          if-no-files-found: error
      - name: Publish ke GitHub Release (tautan unduh langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trada-apk-v1.0
          name: TRADA 2027 Android v1.0
          body: |
            APK aplikasi TRADA 2027 (hibrida: dasbor luring + aplikasi operasional live).
            Login: username infosiaga112. Instal dengan mengaktifkan "Instal aplikasi tak dikenal".
          files: TRADA_2027_v1.0.apk
